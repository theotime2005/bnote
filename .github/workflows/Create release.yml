name: Create release

on:
  push:
    tags:
      - '*'

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # Install system dependencies
          sudo apt-get update
          sudo apt-get install -y zip gcc libdbus-1-dev libffi-dev libssl-dev build-essential python3-dev libglib2.0-dev cmake pkg-config
          
          # Install Python dependencies
          pip install --upgrade pip setuptools wheel build
          pip install -r requirements.txt

      - name: Run script to generate version
        run: sh generate.sh

      - name: Debug - List generated files
        run: |
          echo "=== Files in current directory ==="
          ls -la
          echo "=== Files matching bnote*.whl.zip ==="
          ls -la bnote*.whl.zip || echo "No .whl.zip files found"
          echo "=== All .zip files ==="
          ls -la *.zip || echo "No .zip files found"

      - name: Determine release type
        run: |
          if [[ "${GITHUB_REF##*/}" == *"beta"* || "${GITHUB_REF##*/}" == *"alpha"* || "${GITHUB_REF##*/}" == *"rc"* || "${GITHUB_REF##*/}" == *"a"* || "${GITHUB_REF##*/}" == *"b"* || "${GITHUB_REF##*/}" == *"r"* ]]; then
            echo "prerelease=true" >> $GITHUB_ENV
          else
            echo "prerelease=false" >> $GITHUB_ENV
          fi
          ref_name="${GITHUB_REF_NAME#v}"
          echo "file_tag=$ref_name" >> $GITHUB_ENV

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ env.prerelease }}
          files: "bnote-${{ env.file_tag }}-py3-none-any.whl.zip"
