name: Create release

on:
  push:
    tags:
      - '*'

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 for Raspberry Pi simulation
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies for Raspberry Pi simulation
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-dev \
            python3-pip \
            python3-venv \
            libdbus-1-dev \
            libdbus-glib-1-dev \
            pkg-config \
            libasound2-dev \
            portaudio19-dev \
            libportaudio2 \
            libportaudiocpp0 \
            ffmpeg \
            vlc \
            libvlc-dev \
            zip \
            gzip \
            tar

      - name: Create virtual environment
        run: |
          python3 -m venv venv

      - name: Activate virtual environment and upgrade pip
        run: |
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel

      - name: Install dependencies from bnote.egg-info/requires.txt
        run: |
          source venv/bin/activate
          # Installer les dépendances système spécifiques d'abord
          pip install setuptools wheel build

          # Installer les dépendances avec gestion des erreurs pour les packages spécifiques à Raspberry Pi
          pip install -r bnote.egg-info/requires.txt || {
            echo "❌ Erreur lors de l'installation de bnote.egg-info/requires.txt"
            echo "🔧 Tentative d'installation sans les packages spécifiques à Raspberry Pi..."

            # Créer un fichier requirements temporaire sans les packages problématiques
            grep -v "RPi.GPIO\|dbus-python\|sdbus" bnote.egg-info/requires.txt > requirements_temp.txt || true

            # Installer les autres dépendances
            pip install -r requirements_temp.txt

            # Installer des alternatives pour les packages Raspberry Pi
            pip install fake-rpi || echo "⚠️ fake-rpi non installé"

            echo "✅ Installation adaptée pour l'environnement CI"
          }

      - name: Verify Python environment
        run: |
          source venv/bin/activate
          echo "🐍 Version Python:"
          python --version
          echo ""
          echo "📦 Packages installés:"
          pip list

      - name: Make generate.sh executable
        run: chmod +x generate.sh

      - name: Run generate.sh to build BNote
        run: |
          echo "🚀 Lancement de la compilation BNote..."
          ./generate.sh

      - name: List generated artifacts
        run: |
          echo "📁 Contenu du répertoire après build:"
          ls -la
          echo ""
          echo "📦 Contenu du répertoire dist:"
          ls -la dist/ || echo "Pas de répertoire dist"
          echo ""
          echo "🎯 Fichiers générés (*.whl.zip et *.tar.gz):"
          find . -name "*.whl.zip" -o -name "*.tar.gz" | head -10

      - name: Determine release type
        run: |
          if [[ "${GITHUB_REF##*/}" == *"beta"* || "${GITHUB_REF##*/}" == *"alpha"* || "${GITHUB_REF##*/}" == *"rc"* || "${GITHUB_REF##*/}" == *"a"* || "${GITHUB_REF##*/}" == *"b"* || "${GITHUB_REF##*/}" == *"r"* ]]; then
            echo "prerelease=true" >> $GITHUB_ENV
          else
            echo "prerelease=false" >> $GITHUB_ENV
          fi
          ref_name="${GITHUB_REF_NAME:1}"
          echo "file_tag=$ref_name" >> $GITHUB_ENV

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ env.prerelease }}

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: bnote-${{env.file_tag}}-py3-none-any.whl.zip
          asset_name: bnote-installer-${{env.file_tag}}.whl.zip
          asset_content_type: application/zip
