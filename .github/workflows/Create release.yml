name: Create release

on:
  push:
    tags:
      - '*'

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install QEMU for ARM
        run: |
          sudo apt-get update && sudo apt-get install -y qemu qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Setup Python and Zip in ARM environment, Generate build, and Create release
        run: |
          docker run --platform linux/arm/v7 -v $PWD:/workspace -w /workspace python:3.11-slim-bullseye \
          bash -c "
          apt-get update && \
          apt-get install -y zip gcc libdbus-1-dev libffi-dev libssl-dev build-essential python3-dev libglib2.0-dev cmake pkg-config && \
          python3 -m venv venv && \
          ./venv/bin/pip install --upgrade pip setuptools wheel build && \
          ./venv/bin/pip install -r requirements.txt && \
          sh generate.sh "

      - name: Determine release type
        run: |
          if [[ "${GITHUB_REF##*/}" == *"beta"* || "${GITHUB_REF##*/}" == *"alpha"* || "${GITHUB_REF##*/}" == *"rc"* || "${GITHUB_REF##*/}" == *"a"* || "${GITHUB_REF##*/}" == *"b"* || "${GITHUB_REF##*/}" == *"r"* ]]; then
            echo "prerelease=true" >> $GITHUB_ENV
          else
            echo "prerelease=false" >> $GITHUB_ENV
          fi
          ref_name="${GITHUB_REF_NAME:1}"
          echo "file_tag=$ref_name" >> $GITHUB_ENV

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ env.prerelease }}
          files: bnote-${{ env.file_tag }}-py3-none-any.whl.zip
